<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Property Certificates & Maintenance</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
:root{--bg:#0e1726;--panel:#15233c;--ink:#eaf0fb;--muted:#9fb1d0;--line:rgba(255,255,255,.08);--accent:#4f8cff;--good:#34d399;--warn:#fbbf24;--bad:#f87171;--urg:#ef4444;--radius:16px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 600px at 20% -10%,#1b2c49 0%,#0e1726 55%);color:var(--ink);min-height:100vh}
.wrap{max-width:1240px;margin:0 auto;padding:26px 20px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:16px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0}
.stamp{color:var(--muted);font-size:12px;margin-top:6px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:rgba(255,255,255,.08)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.section-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.chip:hover{background:rgba(79,140,255,.22)}
.chip.sel{background:var(--accent);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(4,1fr)}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;transition:transform .08s}
.kpi:hover{transform:translateY(-2px);border-color:rgba(79,140,255,.5)}
.kpi .n{font-size:28px;font-weight:800;line-height:1}
.kpi .l{font-size:11px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.04em}
.kpi.red .n{color:var(--bad)} .kpi.amber .n{color:var(--warn)} .kpi.green .n{color:var(--good)}
.homes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:1000px){.homes{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.homes{grid-template-columns:1fr 1fr}}
.home{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;position:relative}
.home:hover{border-color:rgba(79,140,255,.5)}
.home.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,140,255,.35)}
.home .nm{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot.red{background:var(--bad);box-shadow:0 0 10px rgba(248,113,113,.7)} .dot.amber{background:var(--warn)} .dot.green{background:var(--good)}
.home .rows{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.7}
.home .rows b{color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chartbox{position:relative;height:270px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
tr.link{cursor:pointer}
tr.link:hover td{background:rgba(79,140,255,.08)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.pill.urgent{background:rgba(239,68,68,.2);color:#fca5a5}
.pill.high{background:rgba(251,191,36,.18);color:var(--warn)}
.pill.normal{background:rgba(79,140,255,.18);color:#bcd3ff}
.pill.low{background:rgba(255,255,255,.08);color:var(--muted)}
.pill.rep{background:rgba(167,139,250,.18);color:#c4b5fd}
.late{color:var(--bad);font-weight:800}
.matrix{overflow-x:auto}
.matrix table td.cell{text-align:center;cursor:pointer;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap}
.cell.ok{background:rgba(52,211,153,.12);color:var(--good)}
.cell.due-soon{background:rgba(251,191,36,.16);color:var(--warn)}
.cell.overdue{background:rgba(248,113,113,.2);color:var(--bad)}
.cell.unknown{background:rgba(255,255,255,.05);color:var(--muted)}
.cell.missing{background:repeating-linear-gradient(45deg,rgba(255,255,255,.03),rgba(255,255,255,.03) 6px,rgba(255,255,255,.07) 6px,rgba(255,255,255,.07) 12px);color:var(--muted);cursor:default}
.cell small{display:block;font-weight:600;opacity:.8}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.search{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink);font-size:13px;min-width:200px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.empty{color:var(--muted);padding:18px;text-align:center}
.loading{color:var(--muted);padding:40px;text-align:center}
.err{color:var(--bad)}
a{color:#bcd3ff}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Property Certificates &amp; Maintenance</h1>
      <p class="sub">Heart &amp; Home Living &mdash; certificates, contractor jobs and home actions (SANDBOX)</p>
      <div class="stamp" id="stamp"></div>
    </div>
    <div class="btns">
      <a class="btn" id="addbtn" target="_blank">+ Add / renew a certificate</a>
      <button class="btn ghost" id="refresh">&#8635; Refresh</button>
    </div>
  </div>
  <div class="chips" id="homechips"></div>
  <div id="content"><div class="loading">Loading the latest snapshot&hellip;</div></div>
</div>
<script>
var DATA_URL = "data.json"; var REBUILD_URL = "https://ruthbloch.app.n8n.cloud/webhook/cert-rebuild";
var ADD_URL = "https://ruthbloch.app.n8n.cloud/form/add-certificate";
document.getElementById('addbtn').href = ADD_URL;
var TYPES = ['Fire Risk Assessment','Gas Safety','Electrical (EICR)','Fire Alarm','Emergency Lighting','Fire Extinguishers','PAT','Legionella / Water','Health & Safety','EPC'];
var SHORT = {'Fire Risk Assessment':'FRA','Gas Safety':'Gas','Electrical (EICR)':'EICR','Fire Alarm':'Fire alarm','Emergency Lighting':'Em. lighting','Fire Extinguishers':'Extinguishers','PAT':'PAT','Legionella / Water':'Legionella','Health & Safety':'H&amp;S','EPC':'EPC'};
var SEVS = ['urgent','high','normal','low'];
var SEVCOL = {urgent:'#ef4444',high:'#fbbf24',normal:'#4f8cff',low:'#64748b'};
var S = {home:'All', cat:'all', sev:'all', late:false, q:''};
var D = null, charts = {};
var DAY = 86400000;
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function dfmt(ms){ if(!ms) return '&mdash;'; return new Date(Number(ms)).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function inHome(x){ return S.home==='All' || x.home===S.home; }
function openF(){ return D.faults.filter(function(f){ return !f.closed; }); }
function late(f){ return f.due && Number(f.due) < Date.now(); }
function sevOk(f){ return S.sev==='all' || (S.sev==='uh' ? (f.severity==='urgent'||f.severity==='high') : f.severity===S.sev); }
function jobs(){
  var q = S.q.toLowerCase();
  return openF().filter(function(f){
    return inHome(f) && (S.cat==='all'||f.category===S.cat) && sevOk(f) && (!S.late||late(f)) &&
      (!q || (f.title+' '+f.home+' '+f.cert).toLowerCase().indexOf(q) >= 0);
  }).sort(function(a,b){ var r = SEVS.indexOf(a.severity)-SEVS.indexOf(b.severity); if(r) return r; return (a.due||9e15)-(b.due||9e15); });
}
function rag(home){
  var c = D.certificates.filter(function(x){ return x.home===home; });
  var f = openF().filter(function(x){ return x.home===home; });
  var red = c.some(function(x){return x.state==='overdue';}) || f.some(function(x){ return x.severity==='urgent' || late(x); });
  var amber = c.some(function(x){return x.state==='due-soon';}) || f.some(function(x){ return x.severity==='high'; });
  return red ? 'red' : (amber ? 'amber' : 'green');
}
function kpi(n,l,cls,act){ return '<div class="kpi '+cls+'" data-a="kpi" data-v="'+act+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
function chip(a,v,label,sel){ return '<span class="chip'+(sel?' sel':'')+'" data-a="'+a+'" data-v="'+v+'">'+label+'</span>'; }

function render(){
  var hc = chip('home','All','All homes',S.home==='All');
  D.homes.forEach(function(h){ hc += chip('home',h,h,S.home===h); });
  document.getElementById('homechips').innerHTML = hc;

  var certs = D.certificates.filter(inHome);
  var of = openF().filter(inHome);
  var overdueC = certs.filter(function(c){return c.state==='overdue';}).length;
  var soonC = certs.filter(function(c){return c.state==='due-soon';}).length;
  var uh = of.filter(function(f){return f.severity==='urgent'||f.severity==='high';}).length;
  var lateJ = of.filter(late).length;
  var mJ = of.filter(function(f){return f.category==='maintenance';}).length;
  var hJ = of.filter(function(f){return f.category==='home';}).length;
  var fixed = D.faults.filter(function(f){ return f.closed && f.confirmedBy && inHome(f) && f.dateClosed && f.dateClosed > Date.now()-7*DAY; }).length;

  var homesHtml = D.homes.map(function(h){
    var c = D.certificates.filter(function(x){return x.home===h;});
    var f = openF().filter(function(x){return x.home===h;});
    var r = rag(h);
    return '<div class="home'+(S.home===h?' sel':'')+'" data-a="home" data-v="'+h+'">' +
      '<div class="nm"><span class="dot '+r+'"></span>'+h+'</div><div class="rows">' +
      'Certificates: <b>'+c.length+'</b> &middot; expired <b>'+c.filter(function(x){return x.state==='overdue';}).length+'</b> &middot; due &le;60d <b>'+c.filter(function(x){return x.state==='due-soon';}).length+'</b><br>' +
      '&#128295; Contractor jobs <b>'+f.filter(function(x){return x.category==='maintenance';}).length+'</b> &middot; &#127968; Home jobs <b>'+f.filter(function(x){return x.category==='home';}).length+'</b><br>' +
      'Urgent/High <b>'+f.filter(function(x){return x.severity==='urgent'||x.severity==='high';}).length+'</b> &middot; past due <b>'+f.filter(late).length+'</b></div></div>';
  }).join('');

  document.getElementById('content').innerHTML =
    '<div class="section-label">At a glance'+(S.home==='All'?' &mdash; all homes':' &mdash; '+S.home)+' &middot; click any tile</div>' +
    '<div class="kpis">' +
      kpi(overdueC,'Certificates expired',overdueC?'red':'green','overdueC') +
      kpi(soonC,'Due in 60 days',soonC?'amber':'green','soonC') +
      kpi(uh,'Urgent &amp; high jobs',uh?'red':'green','uh') +
      kpi(lateJ,'Jobs past due date',lateJ?'red':'green','late') +
      kpi(mJ,'&#128295; Contractor jobs','','maintenance') +
      kpi(hJ,'&#127968; Home jobs','','home') +
      kpi(fixed,'Fixed last 7 days','green','fixed') +
    '</div>' +
    '<div class="section-label">Homes &mdash; click a home to focus everything on it</div>' +
    '<div class="homes">'+homesHtml+'</div>' +
    '<div class="section-label">Certificates</div>' +
    '<div class="card" id="matrixcard"><h2>Certificate status by home &mdash; click a box to open it in ClickUp</h2><div class="matrix" id="matrix"></div>' +
      '<div class="legend"><span><i class="sw" style="background:rgba(52,211,153,.5)"></i>In date</span><span><i class="sw" style="background:rgba(251,191,36,.6)"></i>Due within 60 days</span><span><i class="sw" style="background:rgba(248,113,113,.7)"></i>Expired</span><span><i class="sw" style="background:rgba(255,255,255,.15)"></i>No expiry date / not on system</span></div></div>' +
    '<div class="section-label">Faults</div>' +
    '<div class="grid">' +
      '<div class="card"><h2>Open jobs by home &amp; severity &mdash; click a bar</h2><div class="chartbox"><canvas id="c_home"></canvas></div></div>' +
      '<div class="card"><h2>Contractor vs home jobs &mdash; click a slice</h2><div class="chartbox"><canvas id="c_cat"></canvas></div></div>' +
    '</div>' +
    '<div class="card" id="jobscard"><h2><span>Job list &mdash; click a row to open it</span>' +
      '<span class="toolbar"><input class="search" id="q" placeholder="Search jobs&hellip;" value="'+esc(S.q)+'"></span></h2>' +
      '<div class="toolbar" style="margin-bottom:10px">' +
        '<div class="tabs">'+chip('cat','all','All jobs',S.cat==='all')+chip('cat','maintenance','&#128295; Contractor',S.cat==='maintenance')+chip('cat','home','&#127968; Home',S.cat==='home')+'</div>' +
        '<div class="tabs" style="margin-left:8px">'+chip('sev','all','Any severity',S.sev==='all')+chip('sev','uh','Urgent + High',S.sev==='uh')+chip('sev','urgent','Urgent',S.sev==='urgent')+chip('sev','high','High',S.sev==='high')+chip('sev','normal','Normal',S.sev==='normal')+chip('sev','low','Low',S.sev==='low')+'</div>' +
        '<div class="tabs" style="margin-left:8px">'+chip('late','x','Past due only',S.late)+'</div>' +
      '</div><div id="jobsbox"></div></div>' +
    '<div class="grid">' +
      '<div class="card" id="fixedcard"><h2>Recently confirmed fixed</h2><div id="fixedbox"></div></div>' +
      '<div class="card"><h2>Latest certificate reports</h2><div id="repbox"></div></div>' +
    '</div>';

  buildMatrix(); buildJobs(); buildFixed(); buildReports(); buildCharts();
  document.getElementById('q').addEventListener('input', function(e){ S.q = e.target.value; buildJobs(); });
  document.getElementById('stamp').textContent = 'Snapshot taken ' + new Date(D.snapshot || D.generated).toLocaleString('en-GB') + ' · updates on the 1st of each month, or press Refresh';
}

function buildMatrix(){
  var homes = S.home==='All' ? D.homes : [S.home];
  var h = '<table><thead><tr><th>Home</th>' + TYPES.map(function(t){ return '<th style="text-align:center">'+SHORT[t]+'</th>'; }).join('') + '</tr></thead><tbody>';
  homes.forEach(function(home){
    h += '<tr><td><b>'+home+'</b></td>';
    TYPES.forEach(function(t){
      var cs = D.certificates.filter(function(c){ return c.home===home && c.type===t; });
      if(!cs.length){ h += '<td class="cell missing" title="No '+esc(t)+' task for '+home+'">none</td>'; return; }
      cs.sort(function(a,b){ return (b.expiry||0)-(a.expiry||0); });
      var c = cs[0];
      var label = c.expiry ? (c.daysLeft < 0 ? Math.abs(c.daysLeft)+'d over' : c.daysLeft+'d') : 'no date';
      h += '<td class="cell '+c.state+'" data-a="open" data-v="'+esc(c.url)+'" title="'+esc(c.name)+' - expires '+dfmt(c.expiry).replace(/&mdash;/,'not set')+'">'+label+'<small>'+(c.expiry?dfmt(c.expiry):'&nbsp;')+'</small></td>';
    });
    h += '</tr>';
  });
  document.getElementById('matrix').innerHTML = h + '</tbody></table>';
}

function buildJobs(){
  var list = jobs();
  if(!list.length){ document.getElementById('jobsbox').innerHTML = '<div class="empty">No open jobs match these filters.</div>'; return; }
  var h = '<table><thead><tr><th>Severity</th><th>Type</th><th>Home</th><th>Job</th><th>From</th><th>Due</th></tr></thead><tbody>';
  list.forEach(function(f){
    h += '<tr class="link" data-a="open" data-v="'+esc(f.url)+'">' +
      '<td><span class="pill '+f.severity+'">'+f.severity.toUpperCase()+'</span></td>' +
      '<td>'+(f.category==='home'?'&#127968; Home':'&#128295; Contractor')+'</td>' +
      '<td>'+esc(f.home)+'</td>' +
      '<td>'+(f.repeat?'<span class="pill rep" title="Also open on the previous certificate">&#128257; repeat</span> ':'')+esc(f.title)+'</td>' +
      '<td style="color:var(--muted)">'+esc(f.cert)+'</td>' +
      '<td class="'+(late(f)?'late':'')+'">'+(f.due?dfmt(f.due):'&mdash;')+(late(f)?' &middot; overdue':'')+'</td></tr>';
  });
  document.getElementById('jobsbox').innerHTML = h + '</tbody></table><div class="legend">'+list.length+' job'+(list.length===1?'':'s')+' shown</div>';
}

function buildFixed(){
  var list = D.faults.filter(function(f){ return f.closed && f.confirmedBy && inHome(f); }).sort(function(a,b){ return (b.dateClosed||0)-(a.dateClosed||0); }).slice(0,12);
  if(!list.length){ document.getElementById('fixedbox').innerHTML = '<div class="empty">Nothing confirmed fixed yet. When a manager ticks a job complete, it appears here with their name and date.</div>'; return; }
  var h = '<table><tbody>';
  list.forEach(function(f){ h += '<tr class="link" data-a="open" data-v="'+esc(f.url)+'"><td>&#9989; '+esc(f.title)+'<br><span style="color:var(--muted);font-size:12px">'+esc(f.home)+' &middot; '+esc(f.confirmedBy)+' &middot; '+esc(f.confirmedOn)+'</span></td></tr>'; });
  document.getElementById('fixedbox').innerHTML = h + '</tbody></table>';
}

function buildReports(){
  var list = D.reports.filter(inHome);
  if(!list.length){ document.getElementById('repbox').innerHTML = '<div class="empty">No reports yet for this home.</div>'; return; }
  var h = '<table><tbody>';
  list.forEach(function(r){
    var o = openF().filter(function(f){ return f.reportUrl===r.url; }).length;
    h += '<tr class="link" data-a="open" data-v="'+esc(r.url)+'"><td><b>'+esc(r.home)+'</b> &middot; '+esc(r.cert)+'<br><span style="color:var(--muted);font-size:12px">checked '+esc(r.checked)+' &middot; '+o+' open job'+(o===1?'':'s')+'</span></td></tr>';
  });
  document.getElementById('repbox').innerHTML = h + '</tbody></table>';
}

function destroy(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }
function buildCharts(){
  destroy('c_home'); destroy('c_cat');
  var homes = S.home==='All' ? D.homes : [S.home];
  var of = openF();
  var ds = SEVS.map(function(s){
    return { label: s.charAt(0).toUpperCase()+s.slice(1), data: homes.map(function(h){ return of.filter(function(f){ return f.home===h && f.severity===s && (S.cat==='all'||f.category===S.cat); }).length; }), backgroundColor: SEVCOL[s], borderRadius:5, stack:'s' };
  });
  charts.c_home = new Chart(document.getElementById('c_home'), { type:'bar', data:{ labels:homes, datasets:ds },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#cdd9ef'}}},
      scales:{ x:{stacked:true,ticks:{color:'#cdd9ef'},grid:{display:false}}, y:{stacked:true,beginAtZero:true,ticks:{color:'#9fb1d0',precision:0},grid:{color:'rgba(255,255,255,.06)'}} },
      onClick:function(e,els){ if(!els.length) return; S.home = homes[els[0].index]; S.sev = SEVS[els[0].datasetIndex]; render(); document.getElementById('jobscard').scrollIntoView({behavior:'smooth'}); } } });
  var ofh = of.filter(inHome);
  var m = ofh.filter(function(f){return f.category==='maintenance';}).length, h = ofh.filter(function(f){return f.category==='home';}).length;
  charts.c_cat = new Chart(document.getElementById('c_cat'), { type:'doughnut', data:{ labels:['Contractor jobs','Home jobs'], datasets:[{ data:[m,h], backgroundColor:['#f97316','#34d399'], borderColor:'#15233c', borderWidth:3 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{legend:{position:'right',labels:{color:'#cdd9ef'}}},
      onClick:function(e,els){ if(!els.length) return; S.cat = els[0].index===0 ? 'maintenance' : 'home'; render(); document.getElementById('jobscard').scrollIntoView({behavior:'smooth'}); } } });
}

function applyKpi(v){
  if(v==='overdueC' || v==='soonC'){ document.getElementById('matrixcard').scrollIntoView({behavior:'smooth'}); return false; }
  if(v==='fixed'){ document.getElementById('fixedcard').scrollIntoView({behavior:'smooth'}); return false; }
  S.cat='all'; S.sev='all'; S.late=false;
  if(v==='uh') S.sev='uh';
  if(v==='late') S.late=true;
  if(v==='maintenance') S.cat='maintenance';
  if(v==='home') S.cat='home';
  return true;
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-a]'); if(!el) return;
  var a = el.getAttribute('data-a'), v = el.getAttribute('data-v');
  if(a==='open'){ if(v) window.open(v,'_blank'); return; }
  var scroll = false;
  if(a==='home') S.home = (S.home===v && v!=='All') ? 'All' : v;
  else if(a==='cat') S.cat = v;
  else if(a==='sev') S.sev = v;
  else if(a==='late') S.late = !S.late;
  else if(a==='kpi'){ if(!applyKpi(v)) return; scroll = true; }
  render();
  if(scroll) document.getElementById('jobscard').scrollIntoView({behavior:'smooth'});
});

function load(){
  fetch(DATA_URL + '?t=' + Date.now()).then(function(r){ return r.json(); })
    .then(function(d){ D = d; render(); })
    .catch(function(){ document.getElementById('content').innerHTML = '<div class="loading err">Could not load live data. Check the Property Certificates Data API is active, then Refresh.</div>'; });
}
var rbtn = document.getElementById('refresh');
rbtn.addEventListener('click', function(){ rbtn.disabled = true; rbtn.textContent = 'Refreshing...'; fetch(REBUILD_URL + '?t=' + Date.now()).then(function(r){ return r.json(); }).then(function(d){ D = d; render(); }).catch(function(){ alert('Refresh did not work. Try again in a minute.'); }).then(function(){ rbtn.disabled = false; rbtn.innerHTML = '&#8635; Refresh'; }); });
load();
</script>
</body>
