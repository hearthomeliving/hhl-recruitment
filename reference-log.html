<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Reference Tracker - Heart &amp; Home Living</title>
<style>
:root{--p:#6b4fbb;--pl:#f3effc;--bd:#ddd6f0;--tx:#2b2440;--mut:#6a6383}
*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;background:var(--pl);color:var(--tx);margin:0;padding:16px}
.wrap{max-width:1000px;margin:16px auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 18px rgba(80,60,140,.12)}
h1{color:var(--p);margin:0 0 2px;font-size:21px}h2{margin:0 0 18px;font-size:14px;font-weight:400;color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
input,select{padding:9px 11px;border:1px solid var(--bd);border-radius:9px;font-size:14px;background:#fff;color:var(--tx)}
input#q{flex:1;min-width:180px}
button{background:var(--p);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
button.sec{background:#fff;color:var(--p);border:1px solid var(--bd)}
.count{font-size:13px;color:var(--mut);margin-left:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #eee}
th{color:var(--mut);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--p)}
td a{color:var(--p);text-decoration:none}
tr:hover td{background:#faf8fe}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
.rec{background:#e4f5ec;color:#1c7a4a}
.out{background:#fdf0dc;color:#9a6408}
.exp{background:#fdecec;color:#a33}
.msg{padding:20px;text-align:center;color:var(--mut);font-size:14px}
.err{background:#fdecec;border:1px solid #f5b5b5;border-radius:8px;padding:12px;color:#a33;font-size:13px}
</style></head>
<body><div class="wrap">
<h1>Reference Tracker</h1><h2>One row per referee, per candidate, with whether the reference is still outstanding or received. Data live from ClickUp.</h2>
<div class="bar">
<input id="q" placeholder="Search candidate, referee or email...">
<select id="fstatus"><option value="">All statuses</option><option>Received</option><option>Outstanding</option></select>
<button class="sec" id="refresh">Refresh</button>
<span class="count" id="count"></span>
</div>
<div id="area"><div class="msg">Loading...</div></div>
</div>
<script>
var API="https://ruthbloch.app.n8n.cloud/webhook/reference-data";
var ALL=[],sortKey="requested",sortDir=-1;
function $(x){return document.getElementById(x);}
function fmt(ms){if(!ms)return"";var d=new Date(Number(ms));return d.toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function pill(s){var c=s==="Received"?"rec":(s.indexOf("expired")>=0?"exp":"out");return '<span class="pill '+c+'">'+esc(s)+'</span>';}
function load(){
  $("area").innerHTML='<div class="msg">Loading...</div>';
  fetch(API,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("bad");return r.json();}).then(function(d){ALL=(d&&d.rows)||[];render();}).catch(function(){$("area").innerHTML='<div class="err">Could not load the tracker right now. Press Refresh to try again.</div>';});
}
function render(){
  var q=$("q").value.trim().toLowerCase(),fs=$("fstatus").value;
  var rows=ALL.filter(function(r){
    if(fs){if(fs==="Received"&&r.status!=="Received")return false;if(fs==="Outstanding"&&r.status.indexOf("Outstanding")<0)return false;}
    if(q){var hay=(r.cand+" "+r.refname+" "+r.email).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
  rows.sort(function(a,b){var x=a[sortKey],y=b[sortKey];if(sortKey==="requested"||sortKey==="chases"){x=Number(x)||0;y=Number(y)||0;}else{x=String(x||"").toLowerCase();y=String(y||"").toLowerCase();}return x<y?-sortDir:x>y?sortDir:0;});
  var outstanding=ALL.filter(function(r){return r.status.indexOf("Outstanding")>=0;}).length;
  $("count").textContent=rows.length+" of "+ALL.length+" - "+outstanding+" outstanding";
  if(!rows.length){$("area").innerHTML='<div class="msg">No matching references.</div>';return;}
  var arrow=function(k){return sortKey===k?(sortDir>0?" ▲":" ▼"):"";};
  var h='<table><thead><tr>'
    +'<th data-k="cand">Candidate'+arrow("cand")+'</th>'
    +'<th data-k="refname">Referee'+arrow("refname")+'</th>'
    +'<th data-k="email">Email'+arrow("email")+'</th>'
    +'<th data-k="requested">Requested'+arrow("requested")+'</th>'
    +'<th data-k="chases">Chases'+arrow("chases")+'</th>'
    +'<th data-k="status">Status'+arrow("status")+'</th>'
    +'<th>Application</th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td>'+esc(r.cand)+'</td><td>'+esc(r.refname)+'</td><td>'+esc(r.email)+'</td><td>'+fmt(r.requested)+'</td><td>'+(r.chases||0)+'</td><td>'+pill(r.status)+'</td><td>'+(r.tid?'<a href="https://app.clickup.com/t/'+esc(r.tid)+'" target="_blank">Open</a>':'')+'</td></tr>';
  });
  h+='</tbody></table>';
  $("area").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll("th[data-k]"),function(th){th.addEventListener("click",function(){var k=th.getAttribute("data-k");if(sortKey===k){sortDir=-sortDir;}else{sortKey=k;sortDir=(k==="requested"||k==="chases")?-1:1;}render();});});
}
$("q").addEventListener("input",render);
$("fstatus").addEventListener("change",render);
$("refresh").addEventListener("click",load);
load();
</script></body></html>
