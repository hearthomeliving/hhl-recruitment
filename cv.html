<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Upload CV - Heart &amp; Home Living</title>
<style>
:root{--p:#6b4fbb;--pl:#f3effc;--bd:#ddd6f0;--tx:#2b2440;--err:#d33}
*{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;background:var(--pl);color:var(--tx);margin:0;padding:16px}
.wrap{max-width:560px;margin:24px auto;background:#fff;border-radius:14px;padding:32px;box-shadow:0 4px 18px rgba(80,60,140,.12)}
h1{color:var(--p);margin:0 0 2px;font-size:23px}h2{margin:0 0 20px;font-size:15px;font-weight:400;color:#6a6383}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:34px 20px;text-align:center;color:#6a6383;font-size:14px;cursor:pointer}
.drop.on{border-color:var(--p);background:var(--pl)}
.file{margin-top:12px;font-size:13px;color:var(--tx)}
button{background:var(--p);color:#fff;border:0;border-radius:10px;padding:14px 26px;font-size:16px;font-weight:600;cursor:pointer;margin-top:20px;width:100%}
button:disabled{opacity:.5}
#errbox{background:#fdecec;border:1px solid #f5b5b5;border-radius:8px;padding:10px 14px;margin-top:14px;display:none}
#done{text-align:center;padding:30px 10px;display:none}
.note{background:var(--pl);border-left:4px solid var(--p);padding:10px 12px;border-radius:6px;font-size:13px;margin:14px 0}
</style></head>
<body><div class="wrap">
<div id="formArea">
<h1>Heart &amp; Home Living</h1><h2>Upload a candidate CV</h2>
<div class="note">Drop a CV (PDF) below. We will read it and create a candidate card with the name, contact details and a short summary filled in for you to check.</div>
<div class="drop" id="drop">Click to choose a CV, or drag it here<div class="file" id="fileName"></div></div>
<input type="file" id="cv" accept=".pdf" style="display:none">
<div id="errbox"></div>
<button id="sbtn" disabled>Create candidate from CV</button>
</div>
<div id="done"><h2 id="doneMsg"></h2><button id="again" style="max-width:220px;margin:16px auto 0;display:block">Upload another CV</button></div>
</div>
<script>
var SUBMIT_URL="https://ruthbloch.app.n8n.cloud/webhook/cv-upload-submit";
function $id(x){return document.getElementById(x);}
var drop=$id("drop"),input=$id("cv"),btn=$id("sbtn");
drop.addEventListener("click",function(){input.click();});
["dragover","dragenter"].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add("on");});});
["dragleave","drop"].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove("on");});});
drop.addEventListener("drop",function(ev){if(ev.dataTransfer.files.length){input.files=ev.dataTransfer.files;show();}});
input.addEventListener("change",show);
function show(){if(input.files.length){$id("fileName").textContent=input.files[0].name;btn.disabled=false;}}
$id("again").addEventListener("click",function(){location.reload();});
btn.addEventListener("click",function(){
if(!input.files.length){return;}
var fd=new FormData();fd.append("cv",input.files[0]);
btn.disabled=true;btn.textContent="Reading CV and creating candidate...";
fetch(SUBMIT_URL,{method:"POST",body:fd}).then(function(r){if(!r.ok)throw new Error("bad");$id("formArea").style.display="none";$id("done").style.display="block";$id("doneMsg").textContent="Done. A candidate card has been created from the CV – open Candidates TEST to review and complete it.";}).catch(function(){btn.disabled=false;btn.textContent="Create candidate from CV";var b=$id("errbox");b.textContent="Something went wrong. Please try again.";b.style.display="block";});
});
</script></body></html>
