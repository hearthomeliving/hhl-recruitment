<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Job Application - Heart &amp; Home Living</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f3effc;color:#2b2440;margin:0;padding:16px}
.load{max-width:560px;margin:80px auto;background:#fff;border-radius:14px;padding:44px 36px;box-shadow:0 4px 18px rgba(80,60,140,.12);text-align:center}
.spin{width:44px;height:44px;border:4px solid #ddd6f0;border-top-color:#6b4fbb;border-radius:50%;margin:0 auto 18px;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
h1{color:#6b4fbb;font-size:20px;margin:0 0 6px}
p{font-size:14px;color:#6a6383;margin:0}
</style>
</head>
<body>
<div class="load"><div class="spin"></div><h1>Heart &amp; Home Living</h1><p>Loading your application form...</p></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var t = q.get("t") || "";
  var src = "https://ruthbloch.app.n8n.cloud/webhook/job-application-v2-test?t=" + encodeURIComponent(t);
  fetch(src).then(function (r) {
    if (!r.ok) { throw new Error("http " + r.status); }
    return r.text();
  }).then(function (html) {
    document.open();
    document.write(html);
    document.close();
  }).catch(function () {
    document.body.innerHTML = '<div class="load"><h1>Heart &amp; Home Living</h1><p>Sorry, the application form could not be loaded. Please check your internet connection and try the link again, or email <a href="mailto:Jobs@hearthomeliving.co.uk">Jobs@hearthomeliving.co.uk</a> and we will help.</p></div>';
  });
})();
</script>
</body>
</html>
